name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9"]
    runs-on: ${{ matrix.os }}
    steps:
      # leash borrows its own checkout as a git engine, so this must be a real
      # clone (actions/checkout's default is fine).
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m py_compile cli
      - run: python tests
