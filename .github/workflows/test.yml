name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      # leash borrows its own checkout as a git engine, so this must be a real
      # clone (actions/checkout's default is fine).
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv run --locked python -m py_compile leash.py
      - run: uv run --locked python -c 'import tomllib; tomllib.load(open("config.toml", "rb"))'
      # leash.py's MIN_PYTHON check only works if an older python3 can still parse
      # the file, so it must stay free of syntax newer than 3.9.
      - run: uv run --no-project --python 3.9 python -m py_compile leash.py
      - run: uv run --locked pytest
